<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="980" viewBox="0 0 2100 980" role="img" aria-labelledby="title desc">
  <title id="title">Sitemap bakalarskej prace</title>
  <desc id="desc">Vizualna sitemapa webovej aplikacie FEI TUKE s verejnou castou, pouzivatelskym uctom a administraciou.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#a8a8a8" flood-opacity="0.6"/>
    </filter>
    <style>
      .bg { fill: #ececec; }
      .line { stroke: #777; stroke-width: 2.2; fill: none; }
      .dot { fill: #555; }
      .node { fill: #f8f8f8; stroke: #b9b9b9; stroke-width: 1.6; rx: 4; ry: 4; filter: url(#shadow); }
      .root-node { fill: #333; stroke: #2c2c2c; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #2f2f2f; }
      .small { font-size: 14px; fill: #555; }
      .root-label { fill: #fff; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2100" height="980"/>

  <!-- Top level connectors -->
  <line class="line" x1="1050" y1="82" x2="1050" y2="115"/>
  <line class="line" x1="380" y1="115" x2="1720" y2="115"/>
  <line class="line" x1="380" y1="115" x2="380" y2="155"/>
  <line class="line" x1="1050" y1="115" x2="1050" y2="155"/>
  <line class="line" x1="1720" y1="115" x2="1720" y2="155"/>
  <circle class="dot" cx="380" cy="115" r="5"/>
  <circle class="dot" cx="1050" cy="115" r="5"/>
  <circle class="dot" cx="1720" cy="115" r="5"/>

  <!-- Root -->
  <rect class="node root-node" x="955" y="28" width="190" height="54"/>
  <text class="label root-label" x="1050" y="55">Domov</text>

  <!-- Section nodes -->
  <rect class="node" x="255" y="155" width="250" height="56"/>
  <text class="label" x="380" y="183">Verejna cast</text>

  <rect class="node" x="925" y="155" width="250" height="56"/>
  <text class="label" x="1050" y="183">Ucet pouzivatela</text>

  <rect class="node" x="1595" y="155" width="250" height="56"/>
  <text class="label" x="1720" y="183">Administracia</text>

  <!-- Left section trunk -->
  <line class="line" x1="380" y1="211" x2="380" y2="235"/>
  <line class="line" x1="380" y1="235" x2="320" y2="235"/>
  <line class="line" x1="320" y1="235" x2="320" y2="840"/>

  <!-- Left section branches -->
  <line class="line" x1="320" y1="282" x2="350" y2="282"/>
  <line class="line" x1="320" y1="422" x2="350" y2="422"/>
  <line class="line" x1="320" y1="562" x2="350" y2="562"/>
  <line class="line" x1="320" y1="702" x2="350" y2="702"/>
  <line class="line" x1="320" y1="792" x2="350" y2="792"/>
  <circle class="dot" cx="320" cy="282" r="4"/>
  <circle class="dot" cx="320" cy="422" r="4"/>
  <circle class="dot" cx="320" cy="562" r="4"/>
  <circle class="dot" cx="320" cy="702" r="4"/>
  <circle class="dot" cx="320" cy="792" r="4"/>

  <!-- Programy -->
  <rect class="node" x="350" y="254" width="320" height="56"/>
  <text class="label" x="510" y="278">Studijne odbory</text>
  <text class="label small" x="510" y="297">/programy</text>
  <line class="line" x1="670" y1="282" x2="705" y2="282"/>
  <line class="line" x1="705" y1="282" x2="705" y2="352"/>
  <line class="line" x1="705" y1="352" x2="740" y2="352"/>
  <circle class="dot" cx="705" cy="352" r="4"/>

  <rect class="node" x="740" y="324" width="360" height="56"/>
  <text class="label" x="920" y="348">Detail odboru</text>
  <text class="label small" x="920" y="367">/program/[name]/[field]</text>

  <!-- Aktivity -->
  <rect class="node" x="350" y="394" width="320" height="56"/>
  <text class="label" x="510" y="418">Aktivity katedry</text>
  <text class="label small" x="510" y="437">/aktivity</text>
  <line class="line" x1="670" y1="422" x2="705" y2="422"/>
  <line class="line" x1="705" y1="422" x2="705" y2="492"/>
  <line class="line" x1="705" y1="492" x2="740" y2="492"/>
  <circle class="dot" cx="705" cy="492" r="4"/>

  <rect class="node" x="740" y="464" width="360" height="56"/>
  <text class="label" x="920" y="488">Detail clanku</text>
  <text class="label small" x="920" y="507">/blog/[id]</text>

  <!-- Uspechy -->
  <rect class="node" x="350" y="534" width="320" height="56"/>
  <text class="label" x="510" y="558">Studijne aktuality</text>
  <text class="label small" x="510" y="577">/uspechy</text>
  <line class="line" x1="670" y1="562" x2="705" y2="562"/>
  <line class="line" x1="705" y1="562" x2="705" y2="632"/>
  <line class="line" x1="705" y1="632" x2="740" y2="632"/>
  <circle class="dot" cx="705" cy="632" r="4"/>

  <rect class="node" x="740" y="604" width="360" height="56"/>
  <text class="label" x="920" y="628">Detail clanku</text>
  <text class="label small" x="920" y="647">/blog/[id]</text>

  <!-- Finder -->
  <rect class="node" x="350" y="674" width="320" height="56"/>
  <text class="label" x="510" y="698">Najdi odbor</text>
  <text class="label small" x="510" y="717">/finder</text>

  <!-- Ochrana udajov -->
  <rect class="node" x="350" y="764" width="320" height="56"/>
  <text class="label" x="510" y="788">Ochrana osobnych udajov</text>
  <text class="label small" x="510" y="807">/ochrana-udajov</text>

  <!-- Middle section trunk -->
  <line class="line" x1="1050" y1="211" x2="1050" y2="245"/>
  <line class="line" x1="1050" y1="245" x2="990" y2="245"/>
  <line class="line" x1="990" y1="245" x2="990" y2="470"/>
  <line class="line" x1="990" y1="292" x2="1020" y2="292"/>
  <line class="line" x1="990" y1="382" x2="1020" y2="382"/>
  <circle class="dot" cx="990" cy="292" r="4"/>
  <circle class="dot" cx="990" cy="382" r="4"/>

  <rect class="node" x="1020" y="264" width="320" height="56"/>
  <text class="label" x="1180" y="288">Prihlasenie</text>
  <text class="label small" x="1180" y="307">/login</text>

  <rect class="node" x="1020" y="354" width="320" height="56"/>
  <text class="label" x="1180" y="378">Registracia</text>
  <text class="label small" x="1180" y="397">/register</text>

  <!-- Right section trunk -->
  <line class="line" x1="1720" y1="211" x2="1720" y2="245"/>
  <line class="line" x1="1720" y1="245" x2="1660" y2="245"/>
  <line class="line" x1="1660" y1="245" x2="1660" y2="470"/>
  <line class="line" x1="1660" y1="292" x2="1690" y2="292"/>
  <line class="line" x1="1660" y1="382" x2="1690" y2="382"/>
  <circle class="dot" cx="1660" cy="292" r="4"/>
  <circle class="dot" cx="1660" cy="382" r="4"/>

  <rect class="node" x="1690" y="264" width="320" height="56"/>
  <text class="label" x="1850" y="288">Admin login</text>
  <text class="label small" x="1850" y="307">/admin/login</text>

  <rect class="node" x="1690" y="354" width="320" height="56"/>
  <text class="label" x="1850" y="378">Admin dashboard</text>
  <text class="label small" x="1850" y="397">/admin</text>
</svg>
